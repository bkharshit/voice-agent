[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Standalone, provider-configurable voice agent with PostgreSQL and Google ADK"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3", "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "typer>=0.15,<1",
  "google-adk>=1.28,<2", "litellm>=1.84,<2",
  "httpx>=0.28,<1", "numpy>=2.1,<3", "soundfile>=0.13,<1",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "kokoro-onnx>=0.4,<1", "pipecat-ai[silero]>=0.0.100,<1"]

vosk = ["vosk==0.3.42; sys_platform == 'darwin'", "vosk>=0.3.45,<0.4; sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
voice-agent = "voice_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["services/agent/src/voice_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"services/agent/src/voice_agent/api.py" = ["B008"]

